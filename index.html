<!DOCTYPE html>
<html lang="th">
<head>

    <meta name="google-signin-client_id" content="952813224851-9ufpehbgb7gvk6l4abp2pmteckafe3bl.apps.googleusercontent.com" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Noto Sans Thai', sans-serif; }
        .arabic { font-family: 'Noto Naskh Arabic', serif; font-size: 1.5rem; line-height: 2.2rem; }
        .app-container { max-width: 480px; margin: 0 auto; background: #f8fafc; min-height: 100vh; position: relative; }
        @media (min-width: 640px) { .app-container { border-radius: 32px; margin: 16px auto; min-height: calc(100vh - 32px); box-shadow: 0 20px 60px rgba(0,0,0,0.08); } }

        /* Header Modern */
        .app-header { background: linear-gradient(135deg, #065f46, #0d9488); color: #fff; padding: 12px 16px 10px; border-radius: 0 0 28px 28px; position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .app-header .brand { display: flex; align-items: center; gap: 8px; }
        .app-header .brand h1 { font-size: 1.2rem; font-weight: 700; margin: 0; }
        .app-header .brand .sub { font-size: 0.6rem; opacity: 0.8; }
        .app-header .actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .app-header .actions .btn-icon { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 4px 8px; border-radius: 30px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 4px; }
        .app-header .actions .btn-icon:hover { background: rgba(255,255,255,0.25); }
        .app-header .actions .btn-icon.active { background: rgba(255,255,255,0.3); }
        .app-header .actions .btn-icon .badge { background: #f59e0b; color: #1e293b; font-size: 0.6rem; padding: 1px 6px; border-radius: 20px; margin-left: 2px; }

        /* Side Menu */
        .side-menu {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100vh;
            background: #fff;
            z-index: 9999;
            box-shadow: 4px 0 30px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            padding: 20px 16px;
            overflow-y: auto;
        }
        .side-menu.open { left: 0; }
        .side-menu .close-btn { float: right; font-size: 1.5rem; cursor: pointer; color: #6b7280; border: none; background: none; }
        .side-menu .close-btn:hover { color: #1e293b; }
        .side-menu .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; margin-bottom: 4px; transition: 0.2s; cursor: pointer; color: #1e293b; font-weight: 500; text-decoration: none; }
        .side-menu .menu-item:hover { background: #f1f5f9; }
        .side-menu .menu-item .icon { font-size: 1.2rem; width: 28px; text-align: center; }
        .side-menu .menu-item .badge { background: #f59e0b; color: #1e293b; font-size: 0.7rem; padding: 1px 8px; border-radius: 20px; margin-left: auto; }
        .side-menu .menu-divider { border-top: 1px solid #e5e7eb; margin: 12px 0; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 9998; display: none; }
        .overlay.show { display: block; }

        /* Rest of styles same as before */
        .btn-start { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; font-weight: 700; padding: 14px 32px; border-radius: 40px; border: none; font-size: 1.1rem; width: 100%; transition: 0.2s; cursor: pointer; }
        .btn-start:active { transform: scale(0.97); }
        .btn-primary { background: #065f46; color: #fff; font-weight: 600; padding: 10px 24px; border-radius: 40px; border: none; font-size: 0.95rem; transition: 0.2s; cursor: pointer; }
        .btn-primary:active { transform: scale(0.97); }
        .btn-secondary { background: #f0fdf4; color: #065f46; border: 2px solid #065f46; font-weight: 600; padding: 10px 24px; border-radius: 40px; font-size: 0.95rem; transition: 0.2s; cursor: pointer; }
        .btn-secondary:active { transform: scale(0.97); }
        .btn-gold { background: #f59e0b; color: #fff; font-weight: 700; padding: 10px 24px; border-radius: 40px; border: none; font-size: 0.95rem; transition: 0.2s; cursor: pointer; }
        .btn-gold:active { transform: scale(0.97); }
        .btn-unlock { background: #8b5cf6; color: #fff; font-weight: 600; padding: 4px 12px; border-radius: 20px; border: none; font-size: 0.75rem; transition: 0.2s; cursor: pointer; }
        .btn-unlock:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-unlock-level { background: #7c3aed; color: #fff; font-weight: 700; padding: 6px 16px; border-radius: 20px; border: none; font-size: 0.75rem; transition: 0.2s; cursor: pointer; }
        .btn-unlock-level:disabled { opacity: 0.5; cursor: not-allowed; }

        .card-modern { background: #fff; border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .dan-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 12px; background: #f8fafc; margin-bottom: 6px; transition: 0.2s; cursor: default; border: 2px solid transparent; flex-wrap: wrap; }
        .dan-item.completed { background: #ecfdf5; }
        .dan-item.locked { opacity: 0.5; filter: grayscale(0.3); }
        .dan-item.selected { border-color: #0d9488; background: #f0fdfa; box-shadow: 0 0 0 2px rgba(13,148,136,0.2); }
        .dan-item .info { flex: 1; }
        .dan-item .info .name { font-weight: 600; font-size: 0.9rem; color: #1e293b; }
        .dan-item .info .desc { font-size: 0.7rem; color: #94a3b8; }
        .dan-item .status { font-size: 0.65rem; padding: 2px 10px; border-radius: 20px; font-weight: 600; }
        .dan-item .status.done { background: #dcfce7; color: #16a34a; }
        .dan-item .status.pending { background: #fef3c7; color: #d97706; }
        .dan-item .status.locked-status { background: #f1f5f9; color: #94a3b8; }

        .level-card { margin-bottom: 12px; padding: 10px 12px; background: #f8fafc; border-radius: 12px; border-left: 4px solid #d1d5db; }
        .level-card.unlocked { border-left-color: #3b82f6; background: #eff6ff; }
        .level-card.completed { border-left-color: #16a34a; background: #f0fdf4; }
        .level-card.locked { border-left-color: #9ca3af; opacity: 0.7; }

        .level-progress-bar { height: 4px; background: #e5e7eb; border-radius: 10px; overflow: hidden; margin: 6px 0 8px; }
        .level-progress-bar .fill { height: 100%; background: linear-gradient(90deg, #0d9488, #065f46); border-radius: 10px; transition: width 0.5s ease; }

        .tab-modern { display: flex; gap: 4px; background: #f1f5f9; padding: 4px; border-radius: 16px; margin-bottom: 16px; overflow-x: auto; }
        .tab-modern button { flex: 1; padding: 8px 12px; border: none; border-radius: 12px; font-weight: 600; font-size: 0.75rem; color: #64748b; background: transparent; transition: 0.2s; cursor: pointer; white-space: nowrap; }
        .tab-modern button.active { background: #fff; color: #065f46; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .tab-modern button:active { transform: scale(0.96); }

        .ustadh-card { background: linear-gradient(135deg, #064e3b, #065f46); border-radius: 16px; padding: 12px 16px; color: #fef3c7; display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .ustadh-card .avatar { font-size: 2rem; flex-shrink: 0; }
        .ustadh-card .msg { font-size: 0.85rem; line-height: 1.5; }

        .sentence-word { display: inline-block; padding: 6px 14px; margin: 3px; background: #fff; border-radius: 10px; border: 2px solid #d1d5db; cursor: pointer; transition: 0.2s; font-size: 1rem; direction: rtl; unicode-bidi: plaintext; }
        .sentence-word:hover:not(.placed) { border-color: #0d9488; background: #f0fdfa; }
        .sentence-word.placed { border-color: #16a34a; background: #dcfce7; cursor: default; opacity: 0.7; }

        .reading-word { cursor: pointer; transition: 0.2s; padding: 0 2px; border-radius: 4px; }
        .reading-word:hover { background: #fef3c7; }
        .reading-word.active-word { background: #fbbf24; color: #1e293b; font-weight: 700; }

        .game-overlay {
            position: fixed;
            inset: 0;
            background: #f8fafc;
            z-index: 999;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px 20px 100px;
        }
        .game-overlay.show { display: flex; }
        .game-overlay .close-btn {
            position: sticky;
            top: 0;
            background: white;
            padding: 8px 0;
            margin-bottom: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #1e293b;
            border-bottom: 1px solid #e5e7eb;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }
        .game-overlay .close-btn span { font-size: 1.5rem; }

        .dictionary-popup { /* same as before */ }
        .settings-popup, .support-popup, .exchange-popup { /* same as before */ }

        /* Extra info display */
        .extra-info { background: #f0fdf4; border: 1px solid #16a34a; border-radius: 8px; padding: 8px 12px; margin-top: 8px; font-size: 0.85rem; color: #14532d; display: flex; flex-wrap: wrap; gap: 4px 12px; }
        .extra-info .label { font-weight: 600; }
    </style>
</head>
<body>

<div class="app-container" id="app">

    <!-- Side Menu -->
    <div class="overlay" id="sideOverlay" onclick="closeSideMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <button class="close-btn" onclick="closeSideMenu()">✕</button>
        <div class="brand mt-2 mb-4"><span class="text-2xl">📚</span> <span class="font-bold text-emerald-900">ศึกษา ต่างถิ่น</span></div>
        <div class="menu-item" onclick="switchTab('gameTab'); closeSideMenu();"><span class="icon">🎯</span> ท่องศัพท์</div>
        <div class="menu-item" onclick="switchTab('sentenceTab'); closeSideMenu();"><span class="icon">🧩</span> ประโยค</div>
        <div class="menu-item" onclick="switchTab('readingTab'); closeSideMenu();"><span class="icon">📖</span> บทความ</div>
        <div class="menu-item" onclick="switchTab('vocabTab'); closeSideMenu();"><span class="icon">📚</span> คำศัพท์</div>
        <div class="menu-item" onclick="switchTab('leaderboardTab'); closeSideMenu();"><span class="icon">🏆</span> ลีดเดอร์</div>
        <div class="menu-item" onclick="switchTab('shareTab'); closeSideMenu();"><span class="icon">📤</span> แชร์</div>
        <div class="menu-divider"></div>
        <div class="menu-item" onclick="toggleSettings(); closeSideMenu();"><span class="icon">⚙️</span> ตั้งค่า</div>
        <div class="menu-item" onclick="toggleSupport(); closeSideMenu();"><span class="icon">☕</span> สนับสนุน</div>
        <div class="menu-item" onclick="toggleExchange(); closeSideMenu();"><span class="icon">💎</span> แลกเพชร</div>
        <div class="menu-divider"></div>
        <div class="menu-item" onclick="window.open('https://www.facebook.com/profile.php?id=100064382094369', '_blank')"><span class="icon">📘</span> เพจ Facebook</div>
    </div>

    <!-- HEADER -->
    <header class="app-header">
        <div class="brand">
            <button class="btn-icon" onclick="toggleSideMenu()">☰</button>
            <div>
                <h1>📚 ศึกษา ต่างถิ่น</h1>
                <div class="sub">أُسْتَاذ · เรียนภาษาอาหรับ</div>
            </div>
        </div>
        <div class="actions">
            <button class="btn-icon" onclick="toggleExchange()">💎 <span id="diamondDisplay">0</span></button>
            <span id="starDisplay" class="text-sm font-bold whitespace-nowrap">⭐ 0</span>
            <button class="btn-icon" onclick="toggleSupport()" title="สนับสนุน">☕</button>
            <a href="https://www.facebook.com/profile.php?id=100064382094369" target="_blank" class="btn-icon" title="ไปเพจ">📘</a>
            <button class="btn-icon" onclick="toggleSettings()" title="ตั้งค่า">⚙️</button>
            <div id="userArea" class="flex items-center gap-1">
                <span id="loginStatus" class="text-xs text-white/70">⏳</span>
                <div id="userInfo" class="hidden flex items-center gap-1">
                    <img id="avatarImg" class="w-7 h-7 rounded-full border-2 border-white/30" src="" alt="" />
                    <span id="userName" class="text-sm font-medium cursor-pointer hover:text-yellow-200 whitespace-nowrap max-w-[60px] md:max-w-[100px] truncate" onclick="openEditName()">✏️</span>
                </div>
                <div id="loginButton" class="g_id_signin" data-type="standard" data-size="medium" data-theme="outline" data-text="signin_with" data-shape="pill" data-logo_alignment="left"></div>
                <button id="logoutBtn" class="hidden text-xs text-white/70 hover:text-white underline">ออก</button>
            </div>
        </div>
    </header>

    <!-- TABS (ปรับเป็นปุ่มแบบเดิม แต่เพิ่ม menu) -->
    <div class="px-4 pt-3">
        <div class="tab-modern" id="tabBar">
            <button class="tab-btn active" data-tab="gameTab">🎯 ท่องศัพท์</button>
            <button class="tab-btn" data-tab="sentenceTab">🧩 ประโยค</button>
            <button class="tab-btn" data-tab="readingTab">📖 บทความ</button>
            <button class="tab-btn" data-tab="vocabTab">📚 คำศัพท์</button>
            <button class="tab-btn" data-tab="leaderboardTab">🏆 ลีดเดอร์</button>
            <button class="tab-btn" data-tab="shareTab">📤 แชร์</button>
        </div>
    </div>

    <!-- เนื้อหา tabs เหมือนเดิม (ย่อเพื่อความยาว) -->

    <!-- ====== ส่วนที่เหลือของ HTML (เหมือนเดิม) ====== -->

    <!-- Scripts -->
    <script>
        // ==============================================================
        //  CONFIG (เหมือนเดิม)
        // ==============================================================
        const CONFIG = {
            WORKER_URL: 'https://game-seksatangthin.hem5426.workers.dev',
            GOOGLE_CLIENT_ID: '952813224851-9ufpehbgb7gvk6l4abp2pmteckafe3bl.apps.googleusercontent.com',
            PASSING_SCORE: 60,
            QUESTIONS_PER_GAME: 10,
            TIME_LIMIT: 20,
            PAGE_URL: 'https://www.facebook.com/profile.php?id=100064382094369',
            HINT_COST: 1,
            UNLOCK_LEVEL_COST: 100,
            DIAMONDS_TO_STARS_RATE: 12,
            STREAK_STARS: 3,
        };

        // ==============================================================
        //  STATE, FUNCTIONS (เหมือนเดิม)
        // ==============================================================
        // ... (โค้ด JS ทั้งหมดเหมือนเดิม แต่ปรับส่วนที่เกี่ยวข้อง)
        // 1. เพิ่มฟังก์ชัน toggleSideMenu, closeSideMenu
        // 2. ปรับ switchTab ให้รองรับการคลิกจาก menu
        // 3. ปรับ UI แสดง extra info ในเกมท่องศัพท์
        // 4. ปรับให้เล่นแล้วบันทึก played = TRUE
        // 5. ปรับการปลดล็อก Level อัตโนมัติ
        // 6. ปรับเพชรให้ได้ที่ 90%
        // 7. ปรับ streak ดาว (ส่ง streak ไปใน /scores)
        // 8. ปรับ UI header และ side menu

        // เนื่องจากโค้ด HTML และ JS ยาวมาก เราจะระบุเฉพาะส่วนที่ต้องเพิ่ม/แก้ไข

        // ===== เพิ่มฟังก์ชัน side menu =====
        function toggleSideMenu() {
            document.getElementById('sideMenu').classList.toggle('open');
            document.getElementById('sideOverlay').classList.toggle('show');
        }
        function closeSideMenu() {
            document.getElementById('sideMenu').classList.remove('open');
            document.getElementById('sideOverlay').classList.remove('show');
        }

        // ===== ปรับ switchTab =====
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            const btn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
            if (btn) btn.classList.add('active');
            if (tabId === 'leaderboardTab') renderLeaderboard();
            if (tabId === 'vocabTab') renderVocab();
            if (tabId === 'shareTab') updateShareCard();
            if (tabId === 'sentenceTab') { /* ... */ }
            if (tabId === 'readingTab') { /* ... */ }
        }

        // ===== ปรับ renderOverlayGame ให้แสดง extra info =====
        // ในฟังก์ชัน renderOverlayGame (หรือ selectAnswer) หลังจากตอบถูก
        // ให้เพิ่มการแสดงข้อมูล extra
        function showExtraInfo(q) {
            const extra = [];
            if (q.หมวด === 'คำนาม' || q.หมวด === 'คุณศัพท์') {
                if (q.เอกพจน์ && q.พหูพจน์) extra.push(`📚 เอกพจน์: ${q.เอกพจน์} | พหูพจน์: ${q.พหูพจน์}`);
                else if (q.เอกพจน์) extra.push(`📚 เอกพจน์: ${q.เอกพจน์}`);
                else if (q.พหูพจน์) extra.push(`📚 พหูพจน์: ${q.พหูพจน์}`);
            }
            if (q.หมวด === 'กริยา') {
                if (q.รูปอดีต && q.รูปปัจจุบัน && q.รูปคำสั่ง) {
                    extra.push(`📖 อดีต: ${q.รูปอดีต} | ปัจจุบัน: ${q.รูปปัจจุบัน} | คำสั่ง: ${q.รูปคำสั่ง}`);
                } else if (q.รูปอดีต && q.รูปปัจจุบัน) {
                    extra.push(`📖 อดีต: ${q.รูปอดีต} | ปัจจุบัน: ${q.รูปปัจจุบัน}`);
                } else if (q.รูปอดีต) {
                    extra.push(`📖 อดีต: ${q.รูปอดีต}`);
                }
            }
            if (extra.length > 0) {
                const msg = extra.join(' | ');
                // แสดงใน overlay
                const container = document.getElementById('questionArea') || document.getElementById('resultArea');
                if (container) {
                    const existing = container.querySelector('.extra-info');
                    if (existing) existing.remove();
                    const div = document.createElement('div');
                    div.className = 'extra-info';
                    div.innerHTML = msg;
                    container.appendChild(div);
                    setTimeout(() => { div.remove(); }, 5000);
                }
            }
        }

        // ===== ปรับ endGame ในเกมท่องศัพท์ ให้ส่ง streak ไป /scores =====
        // ในฟังก์ชัน endGame (หรือตอนบันทึก) ต้องส่ง streak
        // ปรับ callAPI('/scores') ให้ส่ง streak ด้วย

        // ===== ปรับฟังก์ชันบันทึกคะแนน sentence/reading ให้บันทึก played = TRUE =====
        // ใน loadSentenceDan และ loadReadingDan เมื่อเริ่มเกม ให้บันทึก played = TRUE
        // โดยเรียก /progress ด้วย played=FALSE? หรือทำเมื่อจบ?
        // ตามที่ผู้ใช้ต้องการ: เมื่อเล่นเสร็จ ระบบบันทึกว่าเล่นแล้ว
        // ดังนั้นใน endGame ของ sentence และ reading ให้เรียก /progress พร้อม passed=... และ played=TRUE

        // ===== ปรับการปลดล็อก Level อัตโนมัติ: หลังจากบันทึก progress =====
        // Worker ทำอยู่แล้ว

        // ===== ปรับการแสดงผลด่าน (เล่นแล้ว) =====
        // ใน HTML, การแสดงสถานะ "เล่นแล้ว" ใช้ข้อมูลจาก progress ที่มี played = TRUE หรือ percent > 0
        // เราต้องปรับ renderDans, renderSentenceDans, renderReadingDans ให้ใช้ played

        // ===== ปรับการให้เพชร =====
        // Worker จัดการแล้ว

        // ===== ปรับ streak ดาว =====
        // ในเกมท่องศัพท์: ส่ง streak ไป /scores
        // ในเกมประโยค: ส่ง streak ไป /progress? (หรือใช้ /scores? แต่ /progress ไม่รองรับ streak)
        // เราจะปรับให้เกมประโยคและบทความส่ง /scores ด้วย? หรือใช้ /add-star แยก?
